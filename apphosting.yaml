# Firebase App Hosting Configuration for Reality Forecast Next.js SSR
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: production
  - variable: OPEN_METEO_BASE_URL
    value: https://api.open-meteo.com
  - variable: NEXT_PUBLIC_APP_URL
    value: https://reality-forecast-app.web.app
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: TOMTOM_API_KEY
    secret: TOMTOM_API_KEY
